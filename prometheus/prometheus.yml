# Prometheus v3.15 configuration.
# 15s scrape interval: the smallest useful gap for a learning stack. Production
# usually stays at 15s-30s; going lower multiplies storage cost, not insight.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    stack: local-learning

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  # The most useful alert in existence: "a target stopped answering".
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus

  - job_name: shop-api
    metrics_path: /metrics
    static_configs:
      - targets: ["shop-api:8000"]
        labels:
          service: shop-api

  # The quarantined cardinality demo. Separate job, separate file, so you can
  # watch the damage in isolation and then scrape it away again.
  - job_name: shop-api-demo
    metrics_path: /metrics/demo
    static_configs:
      - targets: ["shop-api:8000"]
        labels:
          service: shop-api
          tier: demo

  - job_name: payment-gateway
    static_configs:
      - targets: ["payment-gateway:8020"]
        labels:
          service: payment-gateway

  # Metrics the collector received over OTLP, in Prometheus form.
  # If you also turn on OTEL_METRICS_EXPORTER in the app you get a second set
  # of names for the same numbers: docs/08a explains why only one is scraped.
  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:9464"]
        labels:
          service: otel-collector

  # The collector's own health metrics (queue sizes, dropped spans) live on
  # 8888 *inside* the container: that port never reaches the host, and it does
  # not need to, because Prometheus is on the same docker network.
  - job_name: otel-collector-internal
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8888"]
        labels:
          service: otel-collector
          tier: internal

  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          service: node-exporter

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: cadvisor

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service: grafana

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: loki

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
        labels:
          service: alertmanager

  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
        labels:
          service: tempo
