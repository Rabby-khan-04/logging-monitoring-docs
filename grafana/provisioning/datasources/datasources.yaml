apiVersion: 1

# Three datasources, wired with fixed UIDs so dashboards and log-to-trace links
# reference them by name instead of by random id. Grafana 13 deprecated nothing
# here; `tracesToLogsV2` is the current form (the old `tracesToLogs` block is
# what you will see in pre-11 screenshots).

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      httpMethod: POST

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      maxLines: 1000
      # Lets you jump from a log line to the trace it belongs to, using the
      # trace_id field that pino's mixin stamps on every line.
      lokiSearchTraces:
        datasourceUid: tempo

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: false
        spanEndTimeLimit: 3000
      # Service graph needs the metrics generator, enabled in docs/13c.
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
