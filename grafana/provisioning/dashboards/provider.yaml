apiVersion: 1

providers:
  - name: observability-learn
    orgId: 1
    # Dashes instead of the default folder, so `git add` of a dashboard JSON
    # never turns into "where did that file go".
    folder: learning
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
